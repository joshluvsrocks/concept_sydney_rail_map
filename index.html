<head>
<meta charset="utf-8">
<title>Greater Sydney Transport Vision — Shareable Review</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}
.info{background:white;padding:10px 12px;border-radius:6px;box-shadow:0 1px 5px #777;max-width:520px;font:13px/1.42 system-ui,sans-serif}
.small{font-size:11px;color:#555;margin-top:7px}
.layer-panel{
  background:white;
  padding:10px 12px;
  border-radius:6px;
  box-shadow:0 1px 5px #777;
  font:13px/1.35 system-ui,sans-serif;
  max-height:58vh;
  overflow:auto;
  min-width:255px;
}
.layer-panel .title{font-weight:700;margin-bottom:6px}
.layer-panel label{display:block;margin:4px 0;white-space:nowrap}
.layer-panel input{margin-right:7px;vertical-align:middle}
.layer-panel .buttons{display:flex;gap:6px;margin:7px 0 5px}
.layer-panel button{
  border:1px solid #bbb;background:#f7f7f7;border-radius:4px;
  padding:3px 7px;cursor:pointer;font-size:12px
}
.layer-panel .section{margin-top:7px;padding-top:6px;border-top:1px solid #ddd;font-weight:600}


.fixed-layer-panel{
  position:absolute;
  right:12px;
  bottom:12px;
  z-index:10000;
  background:rgba(255,255,255,.98);
  border:1px solid #aaa;
  border-radius:7px;
  box-shadow:0 1px 7px rgba(0,0,0,.35);
  padding:10px 12px;
  width:320px;
  max-height:62vh;
  overflow-y:auto;
  font:13px/1.3 system-ui,sans-serif;
}
.fixed-title{font-weight:700;font-size:14px;margin-bottom:7px}
.fixed-buttons{display:flex;gap:6px;margin-bottom:7px}
.fixed-buttons button{border:1px solid #bbb;border-radius:4px;background:#f5f5f5;padding:4px 8px;cursor:pointer}
.fixed-section{font-weight:700;margin-top:8px;padding-top:6px;border-top:1px solid #ddd}
.fixed-layer-panel label{display:block;margin:4px 0;cursor:pointer}
.fixed-layer-panel input{margin-right:7px}
@media(max-width:800px){
  .fixed-layer-panel{right:6px;bottom:6px;width:285px;max-height:50vh;font-size:12px}
}

.share-title-card{
  position:absolute;
  left:12px;
  top:12px;
  z-index:10000;
  background:rgba(255,255,255,.97);
  border:1px solid #aaa;
  border-radius:7px;
  box-shadow:0 1px 7px rgba(0,0,0,.30);
  padding:9px 11px;
  font-family:system-ui,sans-serif;
  max-width:350px;
}
.share-title{font-size:17px;font-weight:750;line-height:1.15}
.share-subtitle{font-size:11px;color:#555;margin-top:3px}
.share-title-card button{
  margin-top:7px;border:1px solid #bbb;border-radius:4px;background:#f5f5f5;
  padding:4px 8px;cursor:pointer;font-size:12px
}
@media(max-width:800px){
  .share-title-card{left:6px;top:6px;max-width:250px}
  .share-title{font-size:14px}
}

.basemap-row{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:7px;
  font:12px system-ui,sans-serif;
}
.basemap-row label{font-weight:600}
.basemap-row select{
  flex:1;
  border:1px solid #bbb;
  border-radius:4px;
  background:white;
  padding:3px 5px;
  font-size:12px;
}
</style>
</head>

function drawSegments(target, segs, style, label){
  for(const seg of segs){
    L.polyline(seg.map(p=>[p.lat,p.lon]), style).bindTooltip(label,{sticky:true}).addTo(target);
  }
}

function uniqueMarkers(target, groups, members, colorFn, radius, fill){
  const seen=new Set();
  for(const [line,segs] of Object.entries(groups)){
    for(const seg of segs){
      for(const p of seg){
        if(p.name.startsWith('__')) continue;
        if(seen.has(p.name)) continue;
        seen.add(p.name);
        const c=colorFn(line);
        const list=(members[p.name]||[]).join('<br>');
        const pos=p.source ? ('Coordinate source: '+p.source) : (p.exact ? 'Embedded mapped position' : 'Approximate/interpolated geographic position');
        L.circleMarker([p.lat,p.lon],{radius:radius,color:c,weight:1.1,fillColor:fill||'#fff',fillOpacity:1})
         .bindTooltip(p.name,{direction:'top'})
         .bindPopup(`<b>${p.name}</b><br>${list}<br><span style="font-size:11px;color:#555">${pos}</span>`)
         .addTo(target);
      }
    }
  }
}

(function buildPermanentLayerPanel(){
  const list=document.getElementById('fixedLayerList');
  if(!list) return;
  let lastSection=null;
  const controls=[];
  for(const def of permanentLayerDefs){
    if(def.section && def.section!==lastSection){
      lastSection=def.section;
      const s=document.createElement('div');
      s.className='fixed-section';
      s.textContent=def.section;
      list.appendChild(s);
    }
    const label=document.createElement('label');
    const cb=document.createElement('input');
    cb.type='checkbox';
    cb.checked=!!def.checked;

      if(!map.hasLayer(def.layer)) map.addLayer(def.layer);
    }else{
      if(map.hasLayer(def.layer)) map.removeLayer(def.layer);
    }

    cb.addEventListener('change',()=>{
      if(cb.checked){
        if(!map.hasLayer(def.layer)) map.addLayer(def.layer);
      }else{
        if(map.hasLayer(def.layer)) map.removeLayer(def.layer);
      }
    });

    label.appendChild(cb);
    label.appendChild(document.createTextNode(def.label));
    list.appendChild(label);
    controls.push({cb,def});
  }

  document.getElementById('showAllLayers').addEventListener('click',()=>{
    for(const x of controls){
      x.cb.checked=true;
      if(!map.hasLayer(x.def.layer)) map.addLayer(x.def.layer);
    }
  });
  document.getElementById('hideAllLayers').addEventListener('click',()=>{
    for(const x of controls){
      x.cb.checked=false;
      if(map.hasLayer(x.def.layer)) map.removeLayer(x.def.layer);
    }
  });

  document.getElementById('showStationLayers')?.addEventListener('click',()=>{
    for(const x of controls){
      const isStationLayer =
        /station|stop|area/i.test(x.def.label) &&
        !/Official NSW railway track geometry/i.test(x.def.label);
      if(isStationLayer){
        x.cb.checked=true;
        if(!map.hasLayer(x.def.layer)) map.addLayer(x.def.layer);
      }
    }
  });
})();

// -------------------------------------------------------------------------
// Geospatial audit.
// Current heavy-rail / Metro station coordinates are snapped at load time
// to the NSW Spatial Services operational railway-station dataset where a
// name match exists. Light-rail stops are then cross-checked against current
// OpenStreetMap tram-stop geometry. Embedded coordinates remain as fallback.
// An optional official NSW railway polyline layer is also loaded.
// -------------------------------------------------------------------------
function normStationName(s){
  return String(s||'')
    .toLowerCase()
    .replace(/&/g,'and')
    .replace(/['’]/g,'')
    .replace(/\b(railway|train|metro|light rail|lightrail|tram|station|stop)\b/g,' ')
    .replace(/\bsydney\b/g,' ')
    .replace(/[^a-z0-9]+/g,'')
    .trim();
}

const stationAliases = {
  "sydneyolympicpark":"olympicpark",
  "olympicpark":"olympicpark",
  "domesticairport":"domesticairport",
  "internationalairport":"internationalairport",
  "centralgrandconcourse":"central",
  "centralchalmersstreet":"central",
  "childrenshospital":"childrenshospital",
  "juniorskingsford":"juniorskingsford",
  "unswhighstreet":"unswhighstreet",
  "unswanzacparade":"unswanzacparade"
};

function canonName(s){
  const n=normStationName(s);
  return stationAliases[n] || n;
}

function buildLookup(features, sourceType){
  const lookup={};
  for(const f of features){
    let name=null, lat=null, lon=null;
    if(sourceType==='nsw'){
      const a=f.attributes||{};
      name=a.generalname || a.alternativelabel;
      const g=f.geometry||{};
      lon=g.x; lat=g.y;
    } else {
      const tags=f.tags||{};
      name=tags.name;
      if(typeof f.lat==='number'){ lat=f.lat; lon=f.lon; }
      else if(f.center){ lat=f.center.lat; lon=f.center.lon; }
    }
    if(!name || typeof lat!=='number' || typeof lon!=='number') continue;
    const k=canonName(name);
    (lookup[k] ||= []).push({name,lat,lon});
  }
  return lookup;
}

function nearestCandidate(point,cands){
  if(!cands || !cands.length) return null;
  let best=null, bestD=Infinity;
  for(const c of cands){
    const d=(point.lat-c.lat)*(point.lat-c.lat)+(point.lon-c.lon)*(point.lon-c.lon);
    if(d<bestD){bestD=d;best=c;}
  }
  // ~0.04 degrees is far wider than a Sydney station-name mismatch should need.
  return bestD < 0.0016 ? best : null;
}

function snapGroups(groups,lookup,sourceLabel){
  let count=0;
  for(const segs of Object.values(groups)){
    for(const seg of segs){
      for(const point of seg){
        if(point.name.startsWith('__')) continue;
        const c=nearestCandidate(point,lookup[canonName(point.name)]);
        if(c){
          point.lat=c.lat; point.lon=c.lon; point.exact=true; point.source=sourceLabel;
          count++;
        }
      }
    }
  }
  return count;
}

    drawSegments(metroLines,segs,{color:metroColors[name],weight:5.0,opacity:.86,dashArray:'8 5'},name);

  uniqueMarkers(heavyStations,heavy,heavyMember,l=>trainColors[l],3.0,'#fff');
  uniqueMarkers(metroStations,{...metroCurrent,...metroCommitted},metroMember,l=>metroColors[l],4.1,'#fff');
}

function redrawLightRail(){
  lightLines.clearLayers(); lightStops.clearLayers();
  for(const [name,segs] of Object.entries(light))
    drawSegments(lightLines,segs,{color:lightColors[name],weight:4.2,opacity:.92},name);
  uniqueMarkers(lightStops,light,lightMember,l=>lightColors[l],3.6,'#fff');
}

async function loadNSWStationAudit(){
  try{
    const u='https://portal.spatial.nsw.gov.au/server/rest/services/NSW_FOI_Transport_Facilities_multiCRS/FeatureServer/1/query'
      +'?where='+encodeURIComponent('classsubtype=6 AND operationalstatus=1')
      +'&outFields=generalname,alternativelabel&returnGeometry=true&outSR=4326&f=json';
    const r=await fetch(u);
    const data=await r.json();
    if(!data.features) return;
    const lookup=buildLookup(data.features,'nsw');
    const a=snapGroups(heavy,lookup,'NSW Spatial Services');
    const b=snapGroups(metroCurrent,lookup,'NSW Spatial Services');
    const c=snapGroups(metroCommitted,lookup,'NSW Spatial Services');
    if(a+b+c>0) redrawHeavyMetro();
  }catch(e){ console.warn('NSW station audit unavailable; using embedded fallback.',e); }
}

async function loadOSMRailAudit(){
  try{
    const q='[out:json][timeout:25];('+
      'nwr["railway"="station"](-34.25,150.55,-33.45,151.40);'+
      'nwr["railway"="tram_stop"](-34.25,150.55,-33.45,151.40);'+
      ');out center tags;';
    const u='https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q);
    const r=await fetch(u);
    const data=await r.json();
    const lookup=buildLookup(data.elements||[],'osm');

    // Only use OSM for current points that were not already snapped to official NSW data.
    for(const groups of [heavy,metroCurrent,metroCommitted]){
      for(const segs of Object.values(groups)) for(const seg of segs) for(const point of seg){
        if(point.name.startsWith('__') || point.source==='NSW Spatial Services') continue;
        const c=nearestCandidate(point,lookup[canonName(point.name)]);
        if(c){ point.lat=c.lat; point.lon=c.lon; point.exact=true; point.source='OpenStreetMap cross-check'; }
      }
    }
    snapGroups(light,lookup,'OpenStreetMap tram-stop cross-check');
    redrawHeavyMetro();
    redrawLightRail();
  }catch(e){ console.warn('OSM station audit unavailable; using embedded fallback.',e); }
}

async function loadOfficialRailGeometry(){
  try{
    officialRailGeometry.clearLayers();
    let offset=0, more=true;
    while(more && offset<6000){
      const params=new URLSearchParams({
        where:'operationalstatus=1',
        geometry:'150.55,-34.25,151.40,-33.45',
        geometryType:'esriGeometryEnvelope',
        inSR:'4326',
        spatialRel:'esriSpatialRelIntersects',
        outFields:'railwayname',
        returnGeometry:'true',
        outSR:'4326',
        resultOffset:String(offset),
        resultRecordCount:'2000',
        f:'json'
      });
      const u='https://portal.spatial.nsw.gov.au/server/rest/services/NSW_Transport_Theme_multiCRS/FeatureServer/7/query?'+params.toString();
      const r=await fetch(u);
      const data=await r.json();
      for(const f of (data.features||[])){
        const name=(f.attributes||{}).railwayname || 'NSW railway';
        const paths=(f.geometry||{}).paths || [];
        for(const path of paths){
          L.polyline(path.map(x=>[x[1],x[0]]),{
            color:'#555',weight:1.4,opacity:.55
          }).bindTooltip(name,{sticky:true}).addTo(officialRailGeometry);
        }
      }
      more=!!data.exceededTransferLimit;
      offset+=2000;
    }
  }catch(e){ console.warn('Official rail geometry unavailable.',e); }
}

loadNSWStationAudit().then(loadOSMRailAudit);
loadOfficialRailGeometry();
